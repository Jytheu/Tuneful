name: Build Tuneful

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Remove DefaultsMacros from project
        run: |
          sed -i \
            -e '/FE5B56E82D037EEF0077527C.*DefaultsMacros in Frameworks.*PBXBuildFile/d' \
            -e '/FE5B56E82D037EEF0077527C.*DefaultsMacros in Frameworks/d' \
            -e '/FE5B56E72D037EEF0077527C.*DefaultsMacros/d' \
            Tuneful.xcodeproj/project.pbxproj

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Tuneful.xcodeproj \
            -scheme Tuneful

      - name: Build
        run: |
          xcodebuild \
            -project Tuneful.xcodeproj \
            -scheme Tuneful \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find and copy .app
        run: |
          mkdir -p output
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Tuneful.app" -type d | head -1)
          echo "Found app at: $APP"
          cp -R "$APP" output/

      - name: Upload Tuneful.app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tuneful
          path: output/Tuneful.app
          retention-days: 7
          if-no-files-found: error
