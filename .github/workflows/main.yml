name: Build Tuneful
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      
      - name: Resolve Dependencies
        run: xcodebuild -resolvePackageDependencies -project Tuneful.xcodeproj -scheme Tuneful
        
      - name: Build App
        run: xcodebuild -project Tuneful.xcodeproj -scheme Tuneful -configuration Release -destination 'platform=macOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation -derivedDataPath ./build_output build | tee build_logs.txt
        
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: build_logs.txt
          
      - name: Upload App
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tuneful-App
          path: ./build_output/Build/Products/Release/Tuneful.app
